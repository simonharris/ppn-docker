services:

  api:
    build: ./api
    image: ppn-api:latest
    labels:
      - "traefik.http.routers.api.rule=Host(`projects-api.pointbeing.net`)"
      - "traefik.http.routers.api.tls=true"
      - "traefik.http.routers.api.tls.certresolver=letsencrypt"
      - "traefik.http.services.api.loadbalancer.server.port=5000"
    networks:
      - traefik_default
    ports:
      - "5000:5000"
    restart: unless-stopped
    command: ["gunicorn", "main:app", "--workers", "3", "--bind", "0.0.0.0:5000"]

  site:
    build: ./site
    image: ppn-site:latest
    labels:
      - "traefik.http.routers.web.rule=Host(`projects.pointbeing.net`)"
      - "traefik.http.routers.web.tls=true"
      - "traefik.http.routers.web.tls.certresolver=letsencrypt"
      - "traefik.http.services.web.loadbalancer.server.port=5001"
    networks:
      - traefik_default
    ports:
      - "5001:5001"
    depends_on:
      - api
    restart: unless-stopped
    command: ["nginx", "-g", "daemon off;"]


networks:
  traefik_default:
    name: traefik_default
    external: true
